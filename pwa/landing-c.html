<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MurMur — приватный мессенджер</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; background:#fafafa; color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card {
    width:100%; max-width:400px; text-align:center;
    background:#fff; border:1px solid #e5e7eb;
    border-radius:24px; padding:48px 32px 40px;
    box-shadow:0 10px 40px rgba(0,0,0,.06);
  }
  .logo {
    width:72px; height:72px; margin:0 auto 20px; border-radius:20px;
    background:linear-gradient(135deg,#229ED9,#5eead4);
    display:flex; align-items:center; justify-content:center;
    font-size:38px; box-shadow:0 8px 24px rgba(34,158,217,.25);
  }
  h1 { font-size:34px; font-weight:800; letter-spacing:-.5px; color:#0f172a; }
  .sub { color:#64748b; font-size:16px; margin:10px 0 6px; }
  .tagline { color:#64748b; font-size:14.5px; line-height:1.6; margin:18px 0 28px; }
  .tagline b { color:#0f172a; font-weight:600; }
  .cta {
    display:block; width:100%; padding:15px; border-radius:14px; border:none;
    background:#0f172a; color:#fff; font-size:16px; font-weight:600; text-decoration:none;
    transition:transform .15s;
  }
  .cta:active { transform:scale(.97); }
  .hints { margin-top:24px; display:flex; flex-direction:column; gap:12px; text-align:left; }
  .hint { display:flex; gap:10px; align-items:flex-start; font-size:14px; color:#64748b; line-height:1.4; }
  .hint b { color:#0f172a; font-weight:600; }
  .foot { margin-top:26px; font-size:12px; color:#94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🦞</div>
    <h1>MurMur</h1>
    <p class="sub">приватный мессенджер</p>
    <p class="tagline">Ваши сообщения — <b>только ваши</b>. Сквозное шифрование, ключи на устройстве, сервер не знает содержания.</p>
    <a class="cta" href="/">Открыть MurMur →</a>
    <div class="hints">
      <div class="hint"><span>🔐</span><div><b>Сквозное шифрование</b> — ключи только у вас</div></div>
      <div class="hint"><span>🕶️</span><div><b>Анонимно</b> — без телефона и email</div></div>
      <div class="hint"><span>📎</span><div><b>Фото и видео</b> — файлы до 50 МБ</div></div>
    </div>
    <div class="foot">Децентрализованно · открытый протокол</div>
  </div>
</body>
</html>
