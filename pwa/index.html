<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e0e10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>murmur</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>murmur</h1>
        <p class="subtitle" id="status">connecting…</p>
    </header>

    <main>
        <section id="me" class="card">
            <h2>Ты</h2>
            <div class="row">
                <code id="my-name">…</code>
                <button id="btn-new-name">новое имя</button>
            </div>
            <p class="hint" id="my-npub">…</p>
        </section>

        <section id="online" class="card">
            <h2>Онлайн (<span id="online-count">0</span>)</h2>
            <ul id="online-list"></ul>
        </section>

        <section id="inbox" class="card">
            <h2>Входящие (<span id="inbox-count">0</span>)</h2>
            <ul id="inbox-list"></ul>
        </section>

        <section id="send" class="card">
            <h2>Отправить</h2>
            <input id="send-to" type="text" placeholder="кому (напр. ozerov или npub1...)">
            <textarea id="send-text" placeholder="сообщение"></textarea>
            <button id="btn-send">→</button>
            <p id="send-out" class="hint"></p>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
