<!DOCTYPE html>
<html lang="ru">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#17212b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="murmur">
    <!-- Lesson #219 (Олег 2026-08-26 15:42): iPhone PWA standalone mode кэширует
     HTML агрессивно. Cache-Control: no-store в meta http-equiv не всегда
     работает, но Cache-Control: no-cache + no-store + must-revalidate +
     Pragma: no-cache + Expires: 0 — комбинация пробивает больше кэшей. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- v159: OG-теги для превью приглашения при пересылке (Telegram/iMessage/WhatsApp).
     Без них Telegram/iOS лепят случайную заглушку (буква A — fallback для link).
     og:image — абсолютный URL. -->
    <meta property="og:title" content="murmur — приватный мессенджер">
    <meta property="og:description" content="Децентрализованный мессенджер без слежки. Открой ссылку, чтобы присоединиться.">
    <meta property="og:image" content="https://murmur.senswifi.ru/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="1200">
    <meta property="og:url" content="https://murmur.senswifi.ru/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="murmur — приватный мессенджер">
    <meta name="twitter:description" content="Децентрализованный мессенджер без слежки. Открой ссылку, чтобы присоединиться.">
    <meta name="twitter:image" content="https://murmur.senswifi.ru/og-image.png">
    <title>murmur</title>
    <link rel="manifest" href="manifest.json?v=3">
    <script>
    // v160i: invite → PWA start_url. iOS читает манифест В МОМЕНТ «На экран
    // Домой». Свапаем href на УНИКАЛЬНЫЙ PATH /manifest/<npub>.json (без query —
    // iOS вырезает query из URL манифеста при A2HS, а path сохраняет; уникальный
    // путь бьёт кэш манифестов iOS). Плюс ставим cookie-мост (см. ниже).
    (function () {
        var m = (location.pathname || "").match(/\/invite\/(npub1[a-z0-9]+)/i)
            || (location.hash || "").match(/invite=(npub1[a-z0-9]+)/i)
            || (location.search || "").match(/[?&]invite=(npub1[a-z0-9]+)/i);
        if (!m) return;
        var l = document.querySelector('link[rel="manifest"]');
        if (l) l.href = "/manifest/" + m[1] + ".json";
        // Cookie-мост Safari→PWA (куки на iOS общие для сайта, в отличие от
        // localStorage): 30 дней, path=/, SameSite=Lax.
        document.cookie = "murmur_invite=" + m[1] + "; max-age=2592000; path=/; SameSite=Lax";
    })();
    </script>
    <!-- v160e: иконки переименованы в новые имена файлов — iOS отбрасывает ?v= от
         apple-touch-icon (canonicalization), а кэш иконок iOS переживает «Очистить
         историю и данные». Новый путь = новый ключ кэша CF + iOS. -->
    <link rel="apple-touch-icon" href="/ati-2026b.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/i192-2026b.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/fav32-2026b.png">
    <link rel="shortcut icon" href="/favicon-2026b.ico">
    <link rel="mask-icon" href="/mask-icon.svg" color="#229ED9">
    <!-- Lesson #222 (Олег 2026-08-26 15:55): put version in meta tag AND inline
     script. iOS Safari PWA cached HTML может не иметь inline-script (HTML cache
     pre-bump). Meta tag читается через document.querySelector + .content
     (работает даже если inline script не выполнился). -->
    <meta name="app-version" content="v160j">
    <!-- Lesson #216: cache busting via ?v= query string. iOS Safari PWA
     caches app.js via HTTP cache independently of SW. Query string forces
     re-fetch on each version bump. SW CACHE_VERSION also bumps for SW
     activation, but the app.js itself needs explicit URL change. -->
    <link rel="stylesheet" href="styles.css?v=160j">
</head>
<body>
    <!-- ================= IDENTITY SCREEN (create/restore) ================= -->
    <div id="identity-screen" class="screen">
        <!-- DEBUG indicator: shows JS load status. Visible only if JS fails to load. -->
        <noscript>
            <div style="position:fixed;top:0;left:0;right:0;background:#17212b;color:#888;padding:12px;text-align:center;z-index:99999;border-bottom:1px solid #333;font-family:sans-serif;font-size:13px;">
                murmur требует JavaScript. Включи JS в настройках Safari.
            </div>
        </noscript>
        <div class="identity-card">
            <h1 class="brand">murmur</h1>
            <p class="subtitle">приватный мессенджер</p>

            <div class="identity-error" id="identity-error" hidden></div>

            <div class="identity-section">
                <h2>Новый аккаунт</h2>
                <button id="btn-create" class="primary">Создать</button>
            </div>
            <!-- v160e: восстановление вернули — перенос личности между Safari-вкладкой
                 и PWA (разные хранилища на iOS) и между устройствами -->
            <div class="identity-section">
                <h2>У меня есть ключ</h2>
                <input id="restore-hex" type="password" autocomplete="off" spellcheck="false"
                       placeholder="ключ (64 символа)" style="width:100%;box-sizing:border-box;background:#0e1621;color:#e8edf2;border:1px solid #2a3b4d;border-radius:8px;padding:10px;font-size:13px;margin-bottom:8px;">
                <button id="btn-restore" class="secondary">Восстановить</button>
                <button id="btn-redeem-code" class="secondary" style="margin-top:8px;">У меня есть код</button>
            </div>
        </div>
    </div>

    <!-- ================= MESSENGER (sidebar + chat panel) ================= -->
    <div id="messenger" class="messenger" hidden>
        <!-- Lesson #212 (Олег 2026-08-26 14:21): version banner для debug SW update -->
        <div id="version-banner" style="position:fixed;bottom:4px;right:4px;font-size:9px;color:#888;opacity:0.6;z-index:9999;font-family:monospace;pointer-events:none;background:rgba(0,0,0,0.3);padding:1px 4px;border-radius:3px;">…</div>
        <!-- SIDEBAR: chat list -->
        <aside id="sidebar" class="sidebar">
            <header class="sidebar-header">
                <button id="btn-notifications" class="notif-btn" title="Включить уведомления">🔔</button>
                <button id="btn-cache-stats" class="notif-btn" title="Статистика кэша вложений" style="display:none;">💾</button>
                <button id="btn-diag" class="notif-btn" title="Диагностика">📊</button>
            </header>

            <div class="sidebar-footer">
                <button id="btn-invite" class="invite-btn-green">Пригласить друга ✉</button>
                <button id="btn-show-key" class="logout-btn-danger" title="Показать ключ для переноса на другое устройство" style="background:#2b5278;">Мой ключ 🔑</button>
                <button id="btn-logout" class="logout-btn-danger" title="Удалить все данные">Удалить все данные</button>
            </div>

            <div class="chat-search-wrap">
                <input id="chat-search" type="search" placeholder="поиск чатов…" autocomplete="off">
            </div>

            <nav id="chat-list" class="chat-list" aria-label="Чаты">
                <!-- populated by JS: each <button class="chat-item" data-peer="..."> -->
            </nav>
        </aside>

        <!-- EMPTY STATE: shown when no chat is selected (mobile) -->
        <section id="no-chat" class="no-chat" hidden>
            <div class="no-chat-inner">
                <h2>murmur</h2>
                <p>Выберите чат слева или создайте новый.</p>
            </div>
        </section>

        <!-- CHAT VIEW: messages + input -->
        <main id="chat-view" class="chat-view">
            <header class="chat-header">
                <button id="btn-back" class="icon-btn back-btn" title="Назад" aria-label="назад к списку"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
                <div class="chat-peer">
                    <div class="chat-peer-name" id="chat-peer-name">Выберите чат</div>
                </div>
                <button id="btn-delete-chat" class="icon-btn delete-btn" title="Удалить чат" aria-label="удалить чат" hidden>🗑</button>
            </header>

            <section id="chat-panel" class="chat-panel">
                <div id="messages-area" class="messages-area"></div>
            </section>

            <footer id="input-area" class="input-area" hidden>
                <div id="attachments-preview" class="attachments-preview"></div>
                <div class="input-row">
                    <button id="btn-attach" class="attach-btn" title="Прикрепить файл (до 50 МБ)">📎</button>
                    <input type="file" id="file-input" multiple accept="image/jpeg,image/png,image/webp,image/gif,audio/mpeg,audio/ogg,audio/wav,video/mp4,application/pdf,text/plain" style="display:none" />
                    <textarea id="message-input" placeholder="сообщение…" rows="1" autocomplete="off"></textarea>
                    <button id="btn-send" class="send-btn" title="отправить">&#8594;</button>
                </div>
            </footer>
        </main>
    </div>

    <script>
      // ─── Inline handlers (classic script, NOT module) ───
      // Inline script at end of <body> executes AFTER DOM is parsed (no DOMContentLoaded needed).
      // This is critical for iOS PWA standalone where <script type="module"> has flaky support.
      // The handlers check if app.js has loaded _handleCreate / _handleRestore on window yet.
      function bindHandler(elemId, fnName, label) {
        const el = document.getElementById(elemId);
        if (!el) {
          console.warn("[murmur] no element #" + elemId + " — will retry");
          return false;
        }
        el.addEventListener("click", async function(ev) {
          ev.preventDefault();
          ev.stopPropagation();
          // If app.js handler is ready — call it immediately.
          if (typeof window[fnName] === "function") {
            try { await window[fnName](); }
            catch (e) {
              console.error("[murmur] handler error:", e);
              const err = document.getElementById("identity-error");
              if (err) { err.hidden = false; err.textContent = "Ошибка: " + (e.message || e); }
            }
            return;
          }
          // app.js not loaded yet — wait up to 30s for it (PWA cold-start on iPhone
          // can take 10-20s when app.js + WASM module (181 KB) load over Cloudflare
          // tunnel from Russian IP — Lesson #203 (Олег 2026-08-26)).
          const err = document.getElementById("identity-error");
          if (err) {
            err.hidden = false;
            err.textContent = "PWA загружается… подожди (до 30 сек)";
          }
          const deadline = Date.now() + 30000;
          while (Date.now() < deadline && typeof window[fnName] !== "function") {
            await new Promise(r => setTimeout(r, 200));
          }
          if (typeof window[fnName] === "function") {
            if (err) { err.hidden = true; err.textContent = ""; }
            try { await window[fnName](); }
            catch (e) {
              console.error("[murmur] handler error:", e);
              if (err) { err.hidden = false; err.textContent = "Ошибка: " + (e.message || e); }
            }
            return;
          }
          if (err) { err.hidden = false; err.textContent = "PWA не загрузилась. Проверь интернет и обнови страницу."; }
        }, { passive: false });
        return true;
      }
      // Inline script at end of <body> — DOM is already parsed here.
      bindHandler("btn-create", "_handleCreate", "Создать");
      bindHandler("btn-restore", "_handleRestore", "Восстановить");
      // v160f: код переноса — открывает модалку ввода (app.js showRedeemModal).
      document.getElementById("btn-redeem-code")?.addEventListener("click", () => {
        if (typeof window.showRedeemModal === "function") window.showRedeemModal();
        else console.warn("showRedeemModal not ready");
      });
      // Safety: if app.js was loaded before this script, handlers are already wired there.
      console.log("[murmur] inline handlers bound");
    </script>
    <!-- Lesson #218 (Олег 2026-08-26 15:36): inline version detection.
     `document.currentScript` возвращает null для `<script defer>` (известный bug
     браузеров). Inline script сначала ставит `window.__APP_VERSION__` из
     document.querySelector('script[src*="app.js"]').getAttribute('src'). -->
    <script>
        (function() {
            try {
                const s = document.querySelector('script[src*="app.js"]');
                const m = s && s.getAttribute("src").match(/[?&]v=(\d+)/);
                window.__APP_VERSION__ = m ? m[1] : "?";
            } catch (e) { window.__APP_VERSION__ = "?"; }
        })();
    </script>
    <!-- Lesson #216 (Олег 2026-08-26 15:18): ?v= cache busting — iOS Safari
     HTTP cache не обновляет app.js по CACHE_VERSION bump alone.
     Query string = guaranteed fresh load on each deploy. -->
    <script src="blob-cache.js?v=160j" defer></script>
    <script src="app-store.js?v=160j" defer></script>
    <script src="render-attachments.js?v=160j" defer></script>
    <script src="app.js?v=160j" defer></script>
    <script>
      // Register service worker (push notifications only — Lesson #345).
      // Статикой SW не управляет (fetch-хендлера нет), так что
      // controllerchange reload НЕ нужен — убрали (reload-лупы).
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js?v=3").catch(console.error);
      }
    </script>
</body>
</html>
