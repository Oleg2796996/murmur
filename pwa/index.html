    <link rel="manifest" href="manifest.json?v=3">
    <script>
    (function () {
        var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
            || window.navigator.standalone === true;
        if (standalone) return;
        var m = (location.pathname || "").match(/\/invite\/(npub1[a-z0-9]+)/i)
            || (location.hash || "").match(/invite=(npub1[a-z0-9]+)/i)
            || (location.search || "").match(/[?&]invite=(npub1[a-z0-9]+)/i);
        if (!m) return;
        var l = document.querySelector('link[rel="manifest"]');
        if (l) l.href = "/manifest/" + m[1] + ".json";
        document.cookie = "murmur_invite=" + m[1] + "; max-age=2592000; path=/; SameSite=Lax";
    })();
    </script>

</head>
<body>
    <div id="identity-screen" class="screen">
        <noscript>
            <div style="position:fixed;top:0;left:0;right:0;background:#17212b;color:#888;padding:12px;text-align:center;z-index:99999;border-bottom:1px solid #333;font-family:sans-serif;font-size:13px;">
                murmur требует JavaScript. Включи JS в настройках Safari.
            </div>
        </noscript>
        <div class="identity-card">
            <h1 class="brand">murmur</h1>
            <p class="subtitle">приватный мессенджер</p>
            <div class="identity-error" id="identity-error" hidden></div>
            <div class="identity-section">

        </div>
    </div>
    <div id="messenger" class="messenger" hidden>
        <div id="version-banner" style="position:fixed;bottom:4px;right:4px;font-size:9px;color:#888;opacity:0.6;z-index:9999;font-family:monospace;pointer-events:none;background:rgba(0,0,0,0.3);padding:1px 4px;border-radius:3px;">…</div>
        <aside id="sidebar" class="sidebar">
            <!-- v160u (Олег 14:24): иконки из шапки сайдбара убраны. Кнопки остаются
                 в DOM (JS-хендлеры не ломаются: bell = push-toggle на случай дебага,
                 floppy = кэш, diag = диагностика) — просто не отображаются. Пуши
                 включаются автоматически (setupPushSubscription при старте). -->
            <header class="sidebar-header" hidden>
                <button id="btn-notifications" class="notif-btn" title="Включить уведомления">🔔</button>
                <button id="btn-cache-stats" class="notif-btn" title="Статистика кэша вложений" style="display:none;">💾</button>

            </header>
            <div class="sidebar-footer">
                <button id="btn-invite" class="invite-btn-green">Пригласить друга ✉</button>
                <button id="btn-add-by-link" class="logout-btn-danger" title="Вставить invite-ссылку или npub" style="background:#2b5278;">Вставить ссылку 📋</button>
                <button id="btn-logout" class="logout-btn-danger" title="Удалить все данные">Удалить все данные</button>
            </div>
            <div class="chat-search-wrap">

            </div>
        </section>
        <main id="chat-view" class="chat-view">
            <header class="chat-header">
                <button id="btn-back" class="icon-btn back-btn" title="Назад" aria-label="назад к списку"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>

                    <input type="file" id="file-input" multiple accept="image/jpeg,image/png,image/webp,image/gif,audio/mpeg,audio/ogg,audio/wav,video/mp4,application/pdf,text/plain" style="display:none" />
                    <textarea id="message-input" placeholder="сообщение…" rows="1" autocomplete="off"></textarea>
                    <button id="btn-send" class="send-btn" title="отправить">&#8594;</button>
                </div>
            </footer>
        </main>
    </div>
    <script>
      function bindHandler(elemId, fnName, label) {
        const el = document.getElementById(elemId);
        if (!el) return false;
        el.addEventListener("click", async function(ev) {
          ev.preventDefault();
          ev.stopPropagation();
          if (typeof window[fnName] === "function") {
            try { await window[fnName](); }
            catch (e) {
              console.error("[murmur] handler error:", e);
              const err = document.getElementById("identity-error");
              if (err) { err.hidden = false; err.textContent = "Ошибка: " + (e.message || e); }
            }
            return;
          }
          const err = document.getElementById("identity-error");
          if (err) {
            err.hidden = false;
            err.textContent = "PWA загружается… подожди (до 30 сек)";
          }
          const deadline = Date.now() + 30000;
          while (Date.now() < deadline && typeof window[fnName] !== "function") {
            await new Promise(r => setTimeout(r, 200));
          }
          if (typeof window[fnName] === "function") {
            if (err) { err.hidden = true; err.textContent = ""; }
            try { await window[fnName](); }
            catch (e) {
              console.error("[murmur] handler error:", e);
              if (err) { err.hidden = false; err.textContent = "Ошибка: " + (e.message || e); }
            }
            return;
          }
          if (err) { err.hidden = false; err.textContent = "PWA не загрузилась. Проверь интернет и обнови страницу."; }
        }, { passive: false });
        return true;
      }
      bindHandler("btn-create", "_handleCreate", "Создать");
      bindHandler("btn-restore", "_handleRestore", "Восстановить");
    </script>
    <script>
        (function() {
            try {
                const s = document.querySelector('script[src*="app.js"]');
                const m = s && s.getAttribute("src").match(/[?&]v=(\d+)/);
                window.__APP_VERSION__ = m ? m[1] : "?";
            } catch (e) { window.__APP_VERSION__ = "?"; }
        })();
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js?v=6").catch(console.error);
      }
    </script>
