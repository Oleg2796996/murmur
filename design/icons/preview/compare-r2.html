<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#0e1621;font-family:-apple-system,'Segoe UI',sans-serif;color:#fff;padding:20px}
h2{font-size:15px;margin:14px 0 6px;color:#8aa}
.row{display:flex;align-items:flex-end;gap:18px}
.cell{text-align:center}
.cell img{display:block;border-radius:22%}
.cell span{font-size:11px;color:#678;display:block;margin-top:4px}
</style></head><body>
<h2>Вариант 1 — «Пульс» (тихий сигнал, затухающие кольца)</h2>
<div class="row">
<div class="cell"><img src="r2-pulse/icon-512.png" width="128" height="128"><span>128px</span></div>
<div class="cell"><img src="r2-pulse/icon-512.png" width="60" height="60"><span>60px</span></div>
<div class="cell"><img src="r2-pulse/favicon-32.png" width="32" height="32"><span>32px</span></div>
</div>
<h2>Вариант 2 — «Пузырь шёпота» (чат-пузырь + волна)</h2>
<div class="row">
<div class="cell"><img src="r2-bubble/icon-512.png" width="128" height="128"><span>128px</span></div>
<div class="cell"><img src="r2-bubble/icon-512.png" width="60" height="60"><span>60px</span></div>
<div class="cell"><img src="r2-bubble/favicon-32.png" width="32" height="32"><span>32px</span></div>
</div>
<h2>Вариант 3 — «Ммм…» (три штриха гула, murmur = 3 слога)</h2>
<div class="row">
<div class="cell"><img src="r2-mmm/icon-512.png" width="128" height="128"><span>128px</span></div>
<div class="cell"><img src="r2-mmm/icon-512.png" width="60" height="60"><span>60px</span></div>
<div class="cell"><img src="r2-mmm/favicon-32.png" width="32" height="32"><span>32px</span></div>
</div>
<h2>Вариант 4 — «Тихая ночь» (месяц + волна)</h2>
<div class="row">
<div class="cell"><img src="r2-night/icon-512.png" width="128" height="128"><span>128px</span></div>
<div class="cell"><img src="r2-night/icon-512.png" width="60" height="60"><span>60px</span></div>
<div class="cell"><img src="r2-night/favicon-32.png" width="32" height="32"><span>32px</span></div>
</div>
</body></html>
