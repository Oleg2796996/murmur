<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#0e1621;font-family:-apple-system,'Segoe UI',sans-serif;color:#fff;padding:20px}
h2{font-size:15px;margin:14px 0 6px;color:#8aa}
.row{display:flex;align-items:flex-end;gap:18px}
.cell{text-align:center}
.cell img{display:block;border-radius:22%}
.cell span{font-size:11px;color:#678;display:block;margin-top:4px}
.lbl{font-size:13px;color:#aac;margin-bottom:4px}
</style></head><body>
<h2>Вариант 1 — «Диалог» (губы → дуги → ухо)</h2>
<div class="row">
<div class="cell"><img src="v1/icon-512.png" width="128" height="128"><span>128px</span></div>
<div class="cell"><img src="v1/icon-512.png" width="60" height="60"><span>60px (home screen)</span></div>
<div class="cell"><img src="v1/favicon-32.png" width="32" height="32"><span>32px (favicon)</span></div>
</div>
<h2>Вариант 2 — «Чистый шёпот» (губы + 3 дуги)</h2>
<div class="row">
<div class="cell"><img src="v2/icon-512.png" width="128" height="128"><span>128px</span></div>
<div class="cell"><img src="v2/icon-512.png" width="60" height="60"><span>60px (home screen)</span></div>
<div class="cell"><img src="v2/favicon-32.png" width="32" height="32"><span>32px (favicon)</span></div>
</div>
<h2>Вариант 3 — «Диагональ» (губы внизу, ухо вверху)</h2>
<div class="row">
<div class="cell"><img src="v3/icon-512.png" width="128" height="128"><span>128px</span></div>
<div class="cell"><img src="v3/icon-512.png" width="60" height="60"><span>60px (home screen)</span></div>
<div class="cell"><img src="v3/favicon-32.png" width="32" height="32"><span>32px (favicon)</span></div>
</div>
</body></html>
