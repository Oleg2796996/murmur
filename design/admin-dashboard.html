<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MurMur — Admin Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #21262d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --good: #3fb950; --warn: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px; max-width: 960px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .card .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .card .value.good { color: var(--good); }
  .card .value.accent { color: var(--accent); }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .section h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 120px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .bar { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
  .bar.b2 { background: var(--good); }
  .bar-label { font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .bar-count { font-size: 10px; color: var(--text); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .err { color: #f85149; font-size: 13px; padding: 12px; }
  .login-btn {
    display: block; margin: 16px auto; padding: 10px 28px;
    background: #238636; color: #fff; border: none; border-radius: 8px;
    font-size: 14px; cursor: pointer;
  }
  .login-btn:hover { background: #2ea043; }
  footer { margin-top: 16px; color: var(--muted); font-size: 11px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>MurMur <span>admin</span></h1>
  <div class="meta"><span class="live-dot"></span><span id="refreshed">—</span> · авто-обновление 60с</div>
</header>

<div class="grid" id="cards"></div>

<div class="section">
  <h2>Сообщения / час (48h, только из envelopes, relay-нотификации исключены)</h2>
  <div class="bar-chart" id="chart-msgs"><div class="empty">нет данных</div></div>
</div>

<div class="section">
  <h2>Медиа / день (7d)</h2>
  <div class="bar-chart" id="chart-blobs"><div class="empty">нет данных</div></div>
</div>

<footer>MurMur — E2E encrypted, self-hosted. Дашборд показывает только агрегаты, без идентификаторов пользователей.</footer>

<script>
const fmt = (n) => n.toLocaleString("ru-RU");
const fmtBytes = (b) => {
  if (b > 1e9) return (b/1e9).toFixed(1) + " GB";
  if (b > 1e6) return (b/1e6).toFixed(1) + " MB";
  if (b > 1e3) return (b/1e3).toFixed(1) + " KB";
  return b + " B";
};
const hourLabel = (ts) => {
  const d = new Date(ts * 1000);
  return d.toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit"}) + " " + String(d.getHours()).padStart(2,"0") + "h";
};
const dayLabel = (ts) => new Date(ts * 1000).toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit"});

function card(label, value, sub, cls) {
  return `<div class="card"><div class="label">${label}</div><div class="value ${cls||""}">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
}

function renderChart(el, data, labelFn, countIdx) {
  if (!data || !data.length) { el.innerHTML = '<div class="empty">нет данных</div>'; return; }
  const max = Math.max(...data.map(d => d[countIdx]), 1);
  el.innerHTML = data.map(d =>
    `<div class="bar-col">
       <div class="bar-count">${fmt(d[countIdx])}</div>
       <div class="bar" style="height:${Math.max(2, Math.round(d[countIdx]/max*100))}%"></div>
       <div class="bar-label">${labelFn(d[0])}</div>
     </div>`).join("");
}

// v160s2: релей отвечает 401 + WWW-Authenticate → Chromium показывает auth-диалог
// и XHR висит. Поэтому креды вводим сами (localStorage) и шлём заголовок ЯВНО.
const AUTH_KEY = "murmur_admin_auth";
function getAuthHeader() {
  const v = localStorage.getItem(AUTH_KEY);
  if (!v) return null;
  // возвращает «user:pass» — префикс "Basic " добавляет вызывающий
  return v;
}
function askAuth() {
  const v = prompt("Логин:пароль для MurMur admin (например murmur-admin:...)");
  if (v && v.includes(":")) {
    localStorage.setItem(AUTH_KEY, v.trim());
    return v.trim();
  }
  return null;
}

function showLoginButton() {
  const cards = document.getElementById("cards");
  if (!cards || document.getElementById("login-btn")) return;
  cards.innerHTML = `<button id="login-btn" class="login-btn" onclick="doLogin()">🔐 Войти</button>`;
}
async function doLogin() {
  const v = askAuth();
  if (v) load();
}

async function load() {
  try {
    let auth = getAuthHeader();
    if (!auth) {
      // v160s3: не prompt() на auto-load — он блокирует рендер/CDP.
      // Показываем кнопку входа; рендер retry через 2с (пользователь мог ввести в другой вкладке).
      showLoginButton();
      throw new Error("нет авторизации — нажми «Войти»");
    }
    let r = await fetch("/api/stats", {
      cache: "no-store",
      headers: { "Authorization": "Basic " + btoa(auth) },
    });
    if (r.status === 401) {
      // неверные креды — сброс + кнопка входа
      localStorage.removeItem(AUTH_KEY);
      showLoginButton();
      throw new Error("HTTP 401 — неверный логин/пароль");
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const s = await r.json();
    document.getElementById("refreshed").textContent =
      "обновлено " + new Date().toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
    // v160s4: aggregates-only (Олег 2026-09-16). total_users = нарастающий
    // итог по хэшам (без PII); stats_daily = сводная таблица по дням.
    // envelope-счётчики вторичны (TTL 5 мин после доставки сносит всё).
    const todayRow = (s.stats_daily || []).find(r => r[0] === Math.floor(Date.now()/1000/86400)*86400);
    document.getElementById("cards").innerHTML = [
      card("Пользователи всего", fmt(s.total_users ?? s.unique_peers_total), "нарастающий итог · без хранения npub", "accent"),
      card("Активные сегодня", fmt(todayRow ? todayRow[2] : 0), "уникальные пользователи за сегодня", "good"),
      card("Сообщения сегодня", fmt(todayRow ? todayRow[3] : 0), "доставленные за сегодня"),
      card("В TTL-окне", fmt(s.envelopes_pending), "недоставленные · сотрутся сами"),
      card("WS сейчас", fmt(s.ws_connections_now), "живые соединения"),
      card("Медиа всего", fmt(s.blobs_total), `${fmtBytes(s.blobs_bytes_total)} · за 24ч ${fmt(s.blobs_24h)}`),
    ].join("");
    renderChart(document.getElementById("chart-msgs"), (s.stats_daily || []).slice(0, 14).map(r => [r[0], r[3]]).reverse(), dayLabel, 1);
    renderChart(document.getElementById("chart-blobs"), s.blobs_daily, dayLabel, 1);
  } catch (e) {
    const cards = document.getElementById("cards");
    if (cards && !document.getElementById("login-btn")) {
      cards.innerHTML = `<div class="err">Ошибка загрузки: ${e.message}</div>`;
    }
    document.getElementById("refreshed").textContent = "";
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
