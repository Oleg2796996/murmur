[package]
name = "murmur-transport"
version = "0.1.0"
edition = "2021"
description = "P2P transport (iroh) for murmur"
license = "MIT"

[features]
default = []
iroh = ["dep:iroh", "dep:anyhow", "dep:futures-lite"]

[dependencies]
murmur-id = { path = "../murmur-id" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
thiserror = "1"
postcard = { version = "1.0", features = ["alloc", "use-std"] }

# Optional iroh integration
iroh = { version = "0.25", optional = true }
anyhow = { version = "1", optional = true }
futures-lite = { version = "2", optional = true }

[dev-dependencies]
rand = "0.8"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt", "time"] }
iroh = { version = "0.25" }