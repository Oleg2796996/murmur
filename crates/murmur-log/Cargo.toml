[package]
name = "murmur-log"
version = "0.1.0"
edition = "2021"
description = "Append-only local log with Merkle anchoring for murmur"
license = "MIT"

[dependencies]
sha3 = "0.10"
postcard = { version = "1.0", features = ["alloc", "use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"