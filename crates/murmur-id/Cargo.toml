[package]
name = "murmur-id"
version = "0.1.0"
edition = "2021"
description = "Identity layer for murmur: ed25519/X25519 keypair, bech32 npub, postcard serde"
license = "MIT"

[dependencies]
ed25519-dalek = { version = "2.0", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["serde", "static_secrets"] }
rand = "0.8"
rand_core = "0.6"
bech32 = "0.9"
postcard = { version = "1.0", features = ["alloc", "use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
# ECIES: AES-256-GCM + HKDF-SHA256 (Олег 2026-08-24 11:00 MSK, E2E шифрование)
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"
