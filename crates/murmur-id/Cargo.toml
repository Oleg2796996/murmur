[package]
name = "murmur-id"
version = "0.1.0"
edition = "2021"
description = "Identity layer for murmur: ed25519 keys + per-message session keys"
license = "MIT"

[dependencies]
ed25519-dalek = "2.0"
x25519-dalek = "2.0"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
