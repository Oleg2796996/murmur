[package]
name = "murmur-uniffi"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "UniFFI bindings for murmur core — native iOS (Swift) client"

[lib]
name = "murmur_uniffi"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
murmur-id = { path = "../murmur-id" }
murmur-transport = { path = "../murmur-transport" }
rand_core = "0.6"
postcard = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
thiserror = "1"

[dev-dependencies]
rand = "0.8"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
