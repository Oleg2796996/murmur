[workspace]
resolver = "2"
members = [
    "crates/murmur-id",
    "crates/murmur-transport",
    "crates/murmur-log",
    "crates/murmur-mix",
    "crates/murmur-cold",
    "crates/murmur",
    "crates/murmur-witness",
    "crates/murmur-relay",
    "crates/murmur-mobile",
    "crates/murmur-id-wasm",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
